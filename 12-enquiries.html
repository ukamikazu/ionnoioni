<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ionnoioni: Enquiries</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --ink: #1a1410; --paper: #faf6ee; --accent: #7a3b2e; --line: #d8cdb8; }
  * { box-sizing: border-box; }
  body { background: var(--paper); color: var(--ink); font-family: 'Noto Serif', Georgia, serif; margin: 0 auto; padding: 32px 28px 60px; max-width: 720px; font-size: 0.95rem; line-height: 1.55; }
  h1 { text-align: center; font-size: 1.9rem; margin: 0 0 2px; }
  .subtitle { text-align: center; font-size: 1rem; color: var(--accent); margin: 0 0 24px; font-style: italic; }
  p.body { margin: 4px 0 18px; }
  form { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 22px 22px 18px; }
  label { display: block; font-weight: 600; margin: 0 0 4px; }
  .hint { font-weight: normal; color: #6b5b45; font-size: 0.85rem; }
  input[type=text], input[type=email], textarea { width: 100%; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; margin: 0 0 16px; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  textarea { min-height: 170px; resize: vertical; }
  .trap { position: absolute; left: -9999px; }
  button { font: inherit; font-weight: 600; background: var(--accent); color: var(--paper); border: 0; border-radius: 6px; padding: 10px 22px; cursor: pointer; }
  button:hover { background: #5e2c22; }
  .status { margin-top: 14px; font-style: italic; color: var(--accent); min-height: 1.5em; }
  .note { font-size: 0.85rem; color: #a05a2c; font-style: italic; margin-top: 18px; }
</style>
</head>
<body>
<nav class="allpages" style="font-family: 'Noto Serif', Georgia, serif; font-size: 0.85rem; margin: 0 0 12px;"><a href="index.html" style="color: #7a3b2e;">Ionnoioni: all pages</a></nav>
  <h1>Ionnoioni</h1>
  <div class="subtitle">Enquiries</div>
  <p class="body">Questions, corrections, a word Ionnoioni is missing or a phrase you would like to see: all are welcome. Leave a way to reach you and I will write back.</p>
  <form id="enq" action="https://api.web3forms.com/submit" method="POST">
    <input type="hidden" name="access_key" value="ebe2b329-3d3c-450b-9a8b-a71d94db83bf">
    <input type="hidden" name="subject" value="Ionnoioni enquiry">
    <input type="hidden" name="from_name" value="Ionnoioni site">
    <input type="checkbox" name="botcheck" class="trap" tabindex="-1" autocomplete="off">
    <label for="name">Your name <span class="hint">(or what you like to be called)</span></label>
    <input type="text" id="name" name="name" required>
    <label for="email">Your email</label>
    <input type="email" id="email" name="email" required>
    <label for="message">Your message</label>
    <textarea id="message" name="message" required></textarea>
    <button type="submit">Send</button>
    <div class="status" id="status" role="status"></div>
  </form>
  <p class="note">Your message goes straight to the author and is never shown on this site.</p>
<script>
  if (window.top !== window) { var n = document.querySelector('nav.allpages'); if (n) n.style.display = 'none'; }
  document.getElementById('enq').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, s = document.getElementById('status');
    s.textContent = 'Sending...';
    fetch(f.action, { method: 'POST', headers: { 'Accept': 'application/json' }, body: new FormData(f) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.success) { f.reset(); s.textContent = 'Thank you. Your message is on its way.'; }
        else { s.textContent = 'Something went wrong. Please try again in a little while.'; }
      })
      .catch(function () { s.textContent = 'Something went wrong. Please try again in a little while.'; });
  });
</script>
</body>
</html>
